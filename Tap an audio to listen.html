<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap an audio to listen</title>
<style>
:root{--bg:#efe6d8;--ink:#2b2118;--muted:#6f5f4f;--ring:#2b2118;--track:rgba(43,33,24,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--ink:#f2e8da;--muted:#b7a591;--ring:#f2e8da;--track:rgba(242,232,218,.2)}}
:root[data-theme="dark"]{--bg:#1d1611;--ink:#f2e8da;--muted:#b7a591;--ring:#f2e8da;--track:rgba(242,232,218,.2)}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
main{width:min(94vw,600px);padding:28px 0;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.card{margin:0;width:calc((100% - 32px)/3)}
.frame{position:relative;overflow:hidden;width:100%;padding:26px 6px;border:2px solid var(--ring);border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
.frame:focus-visible{outline:3px solid var(--ring);outline-offset:4px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--track);pointer-events:none}
.txt{position:relative}
.frame.playing{background:var(--ink);color:var(--bg)}
.frame.playing .fill{background:rgba(128,128,128,.35)}
.pitch{width:min(86vw,420px);margin:30px auto 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.pitch label{font-size:1.05rem}
.pitch input{width:100%;height:32px;accent-color:var(--ring);cursor:pointer}
#hint{margin:28px 0 0;font-size:1.1rem;color:var(--muted)}
</style>
</head>

<div class="pitch"><label for="pitch">Pitch: <span id="pv"></span></label><input id="pitch" type="range" min="-12" max="12" step="0.5" value="0"></div>
<p id="hint">Tap an audio to listen</p>
</main>
<script>
var hint=document.getElementById('hint'),IDLE='Tap an audio to listen';
var cards=[].slice.call(document.querySelectorAll('.card'));
var sl=document.getElementById('pitch'),sv=document.getElementById('pv');
function rate(){return Math.pow(2,sl.value/12)}
function applyPitch(c){c.a.preservesPitch=false;c.a.mozPreservesPitch=false;c.a.webkitPreservesPitch=false;c.a.playbackRate=rate()}
function label(){var v=+sl.value;sv.textContent=(v>0?'+':'')+v+' semitones ('+rate().toFixed(2)+'x)'}
sl.addEventListener('input',function(){label();cards.forEach(applyPitch)});label();
function ui(c,p){c.btn.classList.toggle('playing',p)}
cards=cards.map(function(el){
var c={a:el.querySelector('audio'),btn:el.querySelector('.frame'),fill:el.querySelector('.fill')};
c.btn.addEventListener('click',function(){
if(c.a.paused){cards.forEach(function(o){if(o!==c&&!o.a.paused)o.a.pause()});applyPitch(c);c.a.play().catch(function(){hint.textContent='Could not play audio'})}else{c.a.pause()}});
c.a.addEventListener('play',function(){ui(c,true);hint.textContent='Playing. Tap to pause'});
c.a.addEventListener('pause',function(){if(!c.a.ended){ui(c,false);hint.textContent=IDLE}});
c.a.addEventListener('ended',function(){ui(c,false);c.fill.style.width='0';hint.textContent=IDLE});
c.a.addEventListener('timeupdate',function(){if(c.a.duration)c.fill.style.width=(100*c.a.currentTime/c.a.duration)+'%'});
return c});
</script>
